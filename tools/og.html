<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#ECEDEF}
  .card{box-sizing:border-box;width:1200px;height:630px;padding:0 88px;display:flex;align-items:center;gap:64px;color:#14171A;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  img{flex:0 0 300px;width:300px;height:300px;object-fit:cover;object-position:50% 60%;border-radius:36px;background:#D5D8DD}
  h1{margin:0;font-size:68px;line-height:1.05;font-weight:600;letter-spacing:-0.02em}
  p{margin:22px 0 0;font-size:29px;line-height:1.4;max-width:21em}
  .mono{margin-top:30px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:19px;line-height:28px;color:#5A6270}
</style>
</head>
<body>
<div class="card">
  <img src="../img/headshot.jpg" alt="">
  <div>
    <h1>Raghavan Madabushi</h1>
    <p>Electrical Engineering @ Georgia Tech. I build systems that prove a robot is safe to run before it runs.</p>
    <div class="mono">ROS 2 · Python · C/C++ · Verilog · computer vision · fail-closed verification</div>
  </div>
</div>
</body>
</html>
